name: Validate PowerShell

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell files
        shell: powershell
        run: |
          $failed = $false

          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null

              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
              )

              if ($errors.Count -gt 0) {
                  $failed = $true
                  Write-Host "Syntax errors in $($_.FullName)" -ForegroundColor Red
                  $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              }
              else {
                  Write-Host "OK: $($_.FullName)" -ForegroundColor Green
              }
          }

          if ($failed) {
              exit 1
          }
